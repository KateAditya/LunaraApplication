name: Build and deploy Node.js app to Azure Web App - lunara-backend-api

on:
  push:
    branches:
      - main
    paths:
      - 'Lunara_backend/**'
      - 'lunara_backend/**'
      - '.github/workflows/main_lunara-backend-api.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Build React Admin Panel
        working-directory: ./Lunara_backend/admin-panel
        run: |
          npm install
          npm run build

      - name: Build Node.js backend
        working-directory: ./Lunara_backend/server
        run: |
          npm install
          npm run build
          npm prune --production
          cp -r ../admin-panel/dist ./admin-dist

      - name: Create deployment bundle
        working-directory: ./Lunara_backend/server
        run: |
          zip -r ../../release.zip dist admin-dist node_modules package.json

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
      
      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'lunara-backend-api'
          slot-name: 'Production'
          package: release.zip
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_5952AFFB9BA54C2D8B8EAE4FC58AA15E }}